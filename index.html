<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AskGPT</title>
    <meta name="description" content="AskGPT Chatbot application developed by Pushpraj Kumar." />
    <meta property="og:title" content="AskGPT" />
    <meta property="og:description" content="AskGPT Chatbot application developed by Pushpraj Kumar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/askgpt-icon.svg" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem("infinity_settings");
          var theme = raw ? JSON.parse(raw).theme : "system";
          var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
